<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reporte de Laboratorio - Microbiología</title>
  <meta name="theme-color" content="#2E1A54" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  
</head>
<body>
  <div id="app-container">
    <header class="nav-header">
      <a href="hub.html" class="btn-back" style="text-decoration:none;">‹</a>
      <div>
        <h2 class="nav-title">Reporte de Laboratorio</h2>
        <div class="nav-subtitle italic" id="pathogen-subtitle">Cargando...</div>
      </div>
    </header>
    <div class="screen-content">
      <div class="img-placeholder micro">
        <span>[Microscopio / Tinción]</span>
        <span class="img-placeholder-hint">(Míralo tú mismo)</span>
      </div>
      <div class="lab-grid">
        <div class="card lab-stat">
          <div class="lab-stat-label">Muestra</div>
          <div class="lab-stat-value" id="lab-muestra"></div>
        </div>
        <div class="card lab-stat">
          <div class="lab-stat-label">Técnica</div>
          <div class="lab-stat-value" id="lab-tecnica"></div>
        </div>
      </div>
      <div class="card-highlight" id="lab-caption"></div>
      <a href="menu.html" class="action-btn" style="text-decoration:none; text-align:center;">Volver al Menú Principal</a>
    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/reporte-laboratorio.js"></script>
</body>
</html>
